<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibi Móveis — Anúncios Ativos</title>
<style>
  :root { --tinta:#111; --cinza:#8a8a8a; --linha:#e8e8e8; --azul:#1a5fb4; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f7f7f7; color:var(--tinta);
         font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .topo { background:#fff; border-bottom:1px solid var(--linha); padding:22px 20px; }
  .wrap { max-width:940px; margin:0 auto; }
  .marca { font-size:20px; font-weight:600; letter-spacing:.2px; }
  .kick { font-size:11px; color:var(--cinza); letter-spacing:1.8px;
          text-transform:uppercase; margin-left:10px; }
  .sub { font-size:13px; color:var(--cinza); margin-top:4px; }
  .barra { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px; }
  .botao { display:inline-block; background:var(--tinta); color:#fff; text-decoration:none;
           font-size:14px; font-weight:600; padding:12px 22px; border-radius:6px; }
  .botao:hover { background:#333; }
  .alt { font-size:12px; color:var(--cinza); }
  .alt a { color:var(--azul); }
  .visor { max-width:940px; margin:22px auto 40px; padding:0 20px; }
  object, iframe { width:100%; height:78vh; border:1px solid var(--linha);
                   border-radius:6px; background:#fff; display:block; }
  .rodape { max-width:940px; margin:0 auto 30px; padding:0 20px;
            font-size:11px; color:#b4b4b4; }
</style>
</head>
<body>
  <div class="topo">
    <div class="wrap">
      <div><span class="marca">Bibi Móveis</span><span class="kick">anúncios ativos</span></div>
      <div class="sub">18 anúncios ativos · 5 páginas · imagens e links diretos do Instagram</div>
      <div class="barra">
        <a class="botao" href="Bibi-Moveis-Anuncios-Ativos.pdf" download>Baixar PDF</a>
        <span class="alt">ou <a href="Bibi-Moveis-Anuncios-Ativos.pdf" target="_blank">abrir em outra aba</a></span>
      </div>
    </div>
  </div>

  <div class="visor">
    <object data="Bibi-Moveis-Anuncios-Ativos.pdf" type="application/pdf">
      <iframe src="Bibi-Moveis-Anuncios-Ativos.pdf" title="Anúncios ativos — Bibi Móveis"></iframe>
    </object>
  </div>

  <div class="rodape">Bibi Móveis · anúncios ativos em 07/10/2026</div>
</body>
</html>
