<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibi Móveis — Anúncios Ativos</title>
<style>
  :root { --tinta:#111; --cinza:#8a8a8a; --linha:#e8e8e8; --azul:#1a5fb4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#f7f7f7; color:var(--tinta);
         font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .topo { background:#fff; border-bottom:1px solid var(--linha); padding:22px 20px; }
  .wrap { max-width:940px; margin:0 auto; }
  .marca { font-size:20px; font-weight:600; letter-spacing:.2px; }
  .kick { font-size:11px; color:var(--cinza); letter-spacing:1.8px;
          text-transform:uppercase; margin-left:10px; }
  .sub { font-size:13px; color:var(--cinza); margin-top:4px; }
  .barra { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; }
  .botao { display:inline-block; background:var(--tinta); color:#fff; text-decoration:none;
           font-size:15px; font-weight:600; padding:14px 24px; border-radius:6px; }
  .botao:hover { background:#333; }
  .botao2 { display:inline-block; background:#fff; color:var(--tinta); text-decoration:none;
            font-size:15px; font-weight:600; padding:13px 22px; border-radius:6px;
            border:1px solid #d5d5d5; }
  .botao2:hover { border-color:#aaa; }
  .nota { font-size:12px; color:var(--cinza); margin-top:8px; line-height:1.5; }
  .visor { max-width:940px; margin:22px auto 40px; padding:0 20px; }
  object, iframe { width:100%; height:78vh; border:1px solid var(--linha);
                   border-radius:6px; background:#fff; display:block; }
  .rodape { max-width:940px; margin:0 auto 30px; padding:0 20px;
            font-size:11px; color:#b4b4b4; }

  /* celular: link dentro de PDF nao e clicavel no visualizador mobile -> manda para a lista */
  @media (max-width:820px) {
    .topo { padding:20px 16px; }
    .visor { display:none; }
    .barra { gap:10px; }
    .botao, .botao2 { display:block; width:100%; text-align:center; padding:16px; font-size:16px; }
  }
</style>
</head>
<body>
  <div class="topo">
    <div class="wrap">
      <div><span class="marca">Bibi Móveis</span><span class="kick">anúncios ativos</span></div>
      <div class="sub">18 anúncios ativos · imagens e links diretos do Instagram</div>
      <div class="barra">
        <a class="botao" href="anuncios.html">Ver os anúncios no Instagram</a>
        <a class="botao2" href="Bibi-Moveis-Anuncios-Ativos.pdf" download>Baixar o PDF</a>
      </div>
      <div class="nota">No celular, use <strong>“Ver os anúncios”</strong> — os links dentro do PDF não abrem em visualizador de celular.</div>
    </div>
  </div>

  <div class="visor">
    <object data="Bibi-Moveis-Anuncios-Ativos.pdf" type="application/pdf">
      <iframe src="Bibi-Moveis-Anuncios-Ativos.pdf" title="Anúncios ativos — Bibi Móveis"></iframe>
    </object>
  </div>

  <div class="rodape">Bibi Móveis · anúncios ativos em 07/10/2026</div>
</body>
</html>
